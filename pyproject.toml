[project]
name = "video-transcription-tool"
version = "1.0.0"
description = "Transcribe video files and URLs using faster-whisper"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.0.0",
    "yt-dlp>=2023.11.14",
    "ffmpeg-python>=0.2.0",
]

[project.scripts]
transcribe = "transcribe:main_with_update"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["transcribe.py"]
